<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTracker Events</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="page-events">
<main class="wrap">
    <header class="site-header">
        <a class="brand" href="/">SpaceTracker</a>
        <nav class="site-nav">
            <a href="/">Home</a>
            <a href="/missions">Missions</a>
            <a href="/sky">Sky</a>
            <a class="active" href="/events">Events</a>
        </nav>
    </header>

    <section class="page-title">
        <h1>Astronomy Events</h1>
        <p class="sub">Sun and moon events</p>
    </section>

    <form method="get" action="/events" class="events-form">
        <input type="number" step="any" name="latitude" th:value="${latitude}" placeholder="Latitude">
        <input type="number" step="any" name="longitude" th:value="${longitude}" placeholder="Longitude">
        <input
            type="text"
            class="wide"
            name="address"
            id="address"
            th:value="${address}"
            placeholder="Or enter full address/city"
        >
        <div class="wide suggest" id="suggestions"></div>
        <input type="date" name="fromDate" th:value="${fromDate}">
        <input type="date" name="toDate" th:value="${toDate}">
        <input type="time" name="time" th:value="${time}">
        <button type="submit">Load Events</button>
    </form>

    <div class="error" th:if="${error}" th:text="${error}">Could not load astronomy events right now.</div>

    <table th:if="${events != null and !#lists.isEmpty(events)}">
        <thead>
        <tr>
            <th>Body</th>
            <th>Type</th>
            <th>Event Time</th>
            <th>Peak Altitude</th>
            <th>Rise</th>
            <th>Set</th>
            <th>Notes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.body}">Sun</td>
            <td th:text="${event.eventType}">eclipse</td>
            <td th:text="${event.eventTime}">2026-08-12 10:30</td>
            <td th:text="${event.peakAltitude}">42.5 deg</td>
            <td th:text="${event.riseTime}">2026-08-12 06:10</td>
            <td th:text="${event.setTime}">2026-08-12 19:44</td>
            <td th:text="${event.note}">Phase: total</td>
        </tr>
        </tbody>
    </table>

    <p class="hint" th:if="${events != null and #lists.isEmpty(events)}">
        No events returned for that range.
    </p>
</main>
<script>
    const latitudeInput = document.querySelector('input[name="latitude"]');
    const longitudeInput = document.querySelector('input[name="longitude"]');
    const addressInput = document.getElementById("address");
    const suggestionsBox = document.getElementById("suggestions");
    const suggestionCache = new Map();
    let debounceTimer = null;

    function hideSuggestions() {
        suggestionsBox.innerHTML = "";
        suggestionsBox.style.display = "none";
    }

    function showSuggestions(items) {
        if (!items || items.length === 0) {
            hideSuggestions();
            return;
        }

        suggestionsBox.innerHTML = "";
        items.forEach((item) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "suggest-item";
            btn.textContent = item.displayName;
            btn.addEventListener("click", () => {
                addressInput.value = item.displayName;
                latitudeInput.value = Number(item.latitude).toFixed(6);
                longitudeInput.value = Number(item.longitude).toFixed(6);
                hideSuggestions();
            });
            suggestionsBox.appendChild(btn);
        });

        suggestionsBox.style.display = "block";
    }

    function norm(text) {
        return text.trim().toLowerCase();
    }

    addressInput.addEventListener("input", () => {
        const query = addressInput.value.trim();

        latitudeInput.value = "";
        longitudeInput.value = "";

        clearTimeout(debounceTimer);
        if (query.length < 3) {
            hideSuggestions();
            return;
        }

        debounceTimer = setTimeout(async () => {
            try {
                const key = norm(query);
                if (suggestionCache.has(key)) {
                    showSuggestions(suggestionCache.get(key));
                    return;
                }

                const response = await fetch(`/api/geocode/suggest?q=${encodeURIComponent(query)}`);
                if (!response.ok) {
                    hideSuggestions();
                    return;
                }

                const data = await response.json();
                suggestionCache.set(key, data);
                showSuggestions(data);
            } catch (_) {
                hideSuggestions();
            }
        }, 300);
    });

    addressInput.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" || suggestionsBox.style.display !== "block") {
            return;
        }

        const first = suggestionsBox.querySelector(".suggest-item");
        if (!first) {
            return;
        }

        event.preventDefault();
        first.click();
    });

    document.addEventListener("click", (event) => {
        if (!suggestionsBox.contains(event.target) && event.target !== addressInput) {
            hideSuggestions();
        }
    });
</script>
</body>
</html>
