<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTracker Events</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="page-events">
<main class="wrap">
    <div class="top">
        <div>
            <h1>Astronomy Events</h1>
            <p class="sub">Sun and moon events</p>
        </div>
        <div class="nav">
            <a href="/">Home</a>
            <a href="/missions">Missions</a>
            <a href="/sky">Sky Position</a>
        </div>
    </div>

    <form method="get" action="/events" class="events-form">
        <input type="number" step="any" name="latitude" th:value="${latitude}" placeholder="Latitude">
        <input type="number" step="any" name="longitude" th:value="${longitude}" placeholder="Longitude">
        <input type="date" name="fromDate" th:value="${fromDate}">
        <input type="date" name="toDate" th:value="${toDate}">
        <input type="time" name="time" th:value="${time}">
        <button type="submit">Load Events</button>
    </form>

    <div class="error" th:if="${error}" th:text="${error}">Could not load astronomy events right now.</div>

    <table th:if="${events != null and !#lists.isEmpty(events)}">
        <thead>
        <tr>
            <th>Body</th>
            <th>Type</th>
            <th>Event Time</th>
            <th>Peak Altitude</th>
            <th>Rise</th>
            <th>Set</th>
            <th>Notes</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.body}">Sun</td>
            <td th:text="${event.eventType}">eclipse</td>
            <td th:text="${event.eventTime}">2026-08-12 10:30</td>
            <td th:text="${event.peakAltitude}">42.5 deg</td>
            <td th:text="${event.riseTime}">2026-08-12 06:10</td>
            <td th:text="${event.setTime}">2026-08-12 19:44</td>
            <td th:text="${event.note}">Phase: total</td>
        </tr>
        </tbody>
    </table>

    <p class="hint" th:if="${events != null and #lists.isEmpty(events)}">
        No events returned for that range.
    </p>
</main>
</body>
</html>
