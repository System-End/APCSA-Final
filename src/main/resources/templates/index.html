<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTracker</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body class="page-home">
<main class="card">
    <header class="site-header">
        <a class="brand" href="/">SpaceTracker</a>
        <nav class="site-nav">
            <a class="active" href="/">Home</a>
            <a href="/missions">Missions</a>
            <a href="/sky">Sky</a>
            <a href="/events">Events</a>
        </nav>
    </header>

    <section class="hero">
        <h1>SpaceTracker</h1>
        <p>Launches, sky position, and events.</p>
    </section>

    <div class="error" th:if="${error}" th:text="${error}">Could not load NASA APOD right now.</div>

    <section class="apod" th:if="${apod != null}">
        <h2>NASA APOD</h2>
        <p class="small" th:text="${apod.date}">date</p>
        <h3 th:text="${apod.title}">title</h3>
        <a
            class="apod-media"
            th:if="${apod.media_type == 'image'}"
            th:href="${apod.hdurl != null and !#strings.isEmpty(apod.hdurl) ? apod.hdurl : apod.url}"
            target="_blank"
            rel="noopener"
        >
            <img th:src="${apod.url}" alt="NASA APOD image">
        </a>
        <p class="apod-copy" th:text="${apod.explanation}">explanation</p>
        <p class="small" th:if="${apod.media_type != 'image'}">
            APOD today is not an image. Open:
            <a th:href="${apod.url}" target="_blank" rel="noopener">NASA link</a>
        </p>
    </section>
</main>
</body>
</html>
